<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>深圳屿贸科技有限公司 | 官网入口</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; background: linear-gradient(160deg, #f0f9ff, #e0f2fe); min-height: 100vh; color: #0f172a; display: flex; align-items: center; justify-content: center; }
  .wrap { text-align: center; padding: 40px 20px; max-width: 760px; }
  .logo { width: 72px; height: 72px; margin: 0 auto 18px; border-radius: 18px; background: linear-gradient(135deg, #0284c7, #38bdf8); color: #fff; font-size: 28px; font-weight: 800; display: flex; align-items: center; justify-content: center; }
  h1 { font-size: 30px; color: #0c4a6e; margin-bottom: 6px; }
  .en { color: #64748b; font-size: 15px; margin-bottom: 26px; }
  .cards { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; margin-top: 20px; }
  .card { background: #fff; border-radius: 16px; padding: 28px 22px; box-shadow: 0 10px 30px rgba(2,132,199,.12); text-decoration: none; color: inherit; transition: transform .18s, box-shadow .18s; }
  .card:hover { transform: translateY(-5px); box-shadow: 0 18px 44px rgba(2,132,199,.2); }
  .card .ic { font-size: 34px; margin-bottom: 10px; }
  .card h2 { font-size: 19px; color: #0c4a6e; margin-bottom: 6px; }
  .card p { color: #64748b; font-size: 13.5px; line-height: 1.6; }
  .card .go { display: inline-block; margin-top: 14px; color: #0284c7; font-weight: 700; font-size: 14px; }
  @media (max-width: 600px) { .cards { grid-template-columns: 1fr; } }
</style>
</head>
<body>
  <div class="wrap">
    <div class="logo">YU</div>
    <h1>深圳屿贸科技有限公司</h1>
    <p class="en">ShenZhen Yumao Technology Co., Ltd. · Pet Water Fountain Manufacturer</p>
    <div class="cards">
      <a class="card" href="company/">
        <div class="ic">🏭</div>
        <h2>公司介绍官网</h2>
        <p>公司简介、工厂实力、车间能力、工厂实拍照片与视频、专利认证、联系方式</p>
        <span class="go">进入公司站 →</span>
      </a>
      <a class="card" href="products/">
        <div class="ic">🐾</div>
        <h2>产品展示官网</h2>
        <p>宠物饮水机、喂食器、猫砂盆等全系产品目录，含美元价格、规格参数与产品图片</p>
        <span class="go">进入产品站 →</span>
      </a>
    </div>
  </div>
</body>
</html>
